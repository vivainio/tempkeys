[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tempkeys"
description = "Temporary keysets backed by the Linux kernel keyring: secrets that become unrecoverable on reboot or clear"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ville Vainio", email = "vivainio@gmail.com" }]
keywords = ["secrets", "keyring", "linux", "keyctl", "credentials", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vivainio/tempkeys"
Repository = "https://github.com/vivainio/tempkeys"
Issues = "https://github.com/vivainio/tempkeys/issues"

[tool.maturin]
bindings = "bin"
